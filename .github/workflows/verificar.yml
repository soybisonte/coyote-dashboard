name: Verificar tutorial y logica
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: '1.5.1'
      - name: Instalar GFX para pruebas host
        run: arduino-cli lib install 'Adafruit GFX Library@1.13.0'
      - name: Validar documentos y copias compartidas
        run: python3 tools/verificar.py
      - name: Pruebas de configuracion, relevadores, logger y TFT
        run: python3 tools/probar.py --gfx "$HOME/Arduino/libraries/Adafruit_GFX_Library"
